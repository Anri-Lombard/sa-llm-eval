  test_math:
    description: AfriMGSM chain-of-thought math (8-shot). Re-score outputs with scripts/rescore.py.
    split: test
    default_fewshot: 8
    tasks_by_language:
      eng: [afrimgsm_cot_eng_prompt_1]
      sot: [afrimgsm_cot_sot_prompt_1]
      xho: [afrimgsm_cot_xho_prompt_1]
      zul: [afrimgsm_cot_zul_prompt_1]

  test_translation:
    description: FLORES-200 and NTREX-128 English<->SA translation (5-shot). Re-score FLORES with scripts/rescore.py.
    split: test
    default_fewshot: 5
    tasks_by_language:
      afr:
        - flores_eng_Latn-afr_Latn_prompt_1
