# South African language model evaluation suites.
#
# Conventions:
# - Validation suites (`val_*`) touch ONLY validation splits (safe for mixture/checkpoint selection).
# - Official test suites (`test_*`) touch held-out test splits; run once per shortlisted checkpoint.
# - `afrixnli_*_prompt_1` is excluded everywhere because lm-eval <= 0.4.12 leaves `{premise}` and
#   `{hypothesis}` unrendered in single braces.
# - `belebele_nso_*` (Sepedi) and `sib_tsn_*` (Setswana) are provided via `custom_tasks/` because
#   upstream AfroBench omits them even though both languages exist in facebook/belebele and Davlan/sib200.

languages:
  all_sa: [afr, eng, nbl, nso, sot, ssw, tsn, tso, ven, xho, zul]
  sa_only: [afr, nbl, nso, sot, ssw, tsn, tso, ven, xho, zul]

suites:
  val_discriminative:
    description: Validation-only discriminative tasks for CPT mixture and checkpoint selection (no test splits accessed).
    split: validation
    default_fewshot: 0
    tasks_by_language:
      afr:
        - sa_val_sib_afr_prompt_1
        - sa_val_sib_afr_prompt_2
        - sa_val_sib_afr_prompt_3
        - sa_val_sib_afr_prompt_4
        - sa_val_sib_afr_prompt_5
      eng:
