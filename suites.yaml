        - sa_val_sib_eng_prompt_5
        - sa_val_afrixnli_eng_prompt_2
        - sa_val_afrixnli_eng_prompt_3
        - sa_val_afrixnli_eng_prompt_4
        - sa_val_afrixnli_eng_prompt_5
        - sa_val_afrimmlu_eng
        - sa_val_injongointent_eng_prompt_1
      nso:
        - sa_val_sib_nso_prompt_1
        - sa_val_sib_nso_prompt_2
        - sa_val_sib_nso_prompt_3
        - sa_val_sib_nso_prompt_4
