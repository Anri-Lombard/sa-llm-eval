dataset_path: masakhane/afrixnli
output_type: multiple_choice
validation_split: validation
should_decontaminate: false
metric_list:
  - metric: f1
    aggregation: !function utils.weighted_f1_score
    average: weighted
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
  - metric: acc
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
